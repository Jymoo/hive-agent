name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.24.x'
    - run: go test ./...
    - run: go vet ./...
  helm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: azure/setup-helm@v4
    - run: helm lint charts/hive-agent --set clusterName=test --set apiEndpoint=https://example.com --set apiKey=agt_test --set provider=aws
