apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hive-agent.fullname" . }}
  labels: {{- include "hive-agent.labels" . | nindent 4 }}
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hive-agent.fullname" . }}
  labels: {{- include "hive-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hive-agent.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "hive-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
